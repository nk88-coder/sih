<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SIH Chat</title>
    <link rel="stylesheet" href="/sih.css" />
</head>
<body>
    <div class="bg">
        <div class="orb orb-a"></div>
        <div class="orb orb-b"></div>
        <div class="grid3d"></div>
    </div>
    <div class="app">
        <header class="header">
            <div class="title">SIH Assistant</div>
        </header>
        <div class="orb-container">
            <div class="avatar-orb"></div>
        </div>
        <main class="main">
            <div id="messages" class="messages"></div>
        </main>
        <footer class="composer">
            <input id="prompt" class="input" type="text" placeholder="Type your message..." />
            <input id="fileInput" type="file" style="display:none" />
            <button id="pickFile" class="file-btn" title="Pick a file">📁</button>
            <button id="askBtn" class="file-btn" title="Ask over PDF">🔎</button>
            <button id="tgBtn" class="file-btn" title="Open Telegram Bot">✈️</button>
            <button id="send" class="send">Send</button>
        </footer>
    </div>

    <script src="/sih.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('prompt');
            input.focus();
        });
    </script>
    </body>
    </html>
